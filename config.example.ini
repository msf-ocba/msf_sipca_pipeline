; SIPCA Pipeline Configuration
; 1. Copy this file to "config.ini"
; 2. Fill in the real values below in config.ini (never in this example file)
; 3. Keep config.ini OUT of version control (see .gitignore) and
;    restrict its permissions:  chmod 600 config.ini

[azure]
; --- Option A: connection string (simplest, from Storage Account > Access keys) ---
connection_string =

; --- Option B (alternative to connection_string): account URL + SAS token ---
; Leave connection_string empty above if you use this instead.
account_url =
sas_token =

container_name   = sipca
folder_path      = raw
blob_name        = event_index.json

; Where the downloaded file is written locally
local_download_path = ./data/event_index.json

[paths]
report_dir  = ./reports
log_dir     = ./logs
status_file = ./data/sipca_status.json

[smtp]
enabled  = false
host     = smtp.gmail.com
port     = 587
user     =
password =
from_addr =
; comma-separated list of recipients
to_addrs  =

; Subject line changes automatically depending on the outcome —
; no need to edit these unless you want different wording.
subject_action_required = SIPCA Tasks Review : Action Required
subject_no_action       = SIPCA Tasks Review : All Clear, No Action Required

; If true, only send an email when action_required > 0.
; If false (default here), send a status email every run regardless,
; so recipients get a weekly "all clear" confirmation too.
send_only_if_action_required = false
